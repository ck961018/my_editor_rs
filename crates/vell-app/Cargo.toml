[package]
name = "vell-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
vell-core = { path = "../vell-core" }
vell-frontend = { path = "../vell-frontend" }
vell-mode = { path = "../vell-mode" }
vell-protocol = { path = "../vell-protocol" }
vell-theme = { path = "../vell-theme" }
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
] }

[dev-dependencies]
vell-mode = { path = "../vell-mode", features = ["test-support"] }
vell-plugin-v8 = { path = "../vell-plugin-v8", features = ["test-support"] }
