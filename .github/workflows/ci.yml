name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal \
            --component clippy,rustfmt
          rustup default 1.88.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets --all-features --
          -D warnings
      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Check TypeScript contracts
        run: pnpm typecheck

  core:
    name: Core without V8 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Test V8-independent crates
        run: >-
          cargo test --locked
          -p vell-protocol
          -p vell-completion
          -p vell-core
          -p vell-frontend
          -p vell-mode
          -p vell-tui
      - name: Check the application boundary without dev dependencies
        run: cargo check --locked -p vell-app --lib
      - name: Verify application dependencies exclude V8 on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tree="$(cargo tree -p vell-app --edges normal)"
          if grep -E '(^|[[:space:]])v8 v' <<<"$tree"; then
            echo 'vell-app must not depend on V8' >&2
            exit 1
          fi
      - name: Verify application dependencies exclude V8 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tree = cargo tree -p vell-app --edges normal
          if ($tree -match '(^|\s)v8 v') {
            throw 'vell-app must not depend on V8'
          }

  completion-performance:
    name: Completion performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the PR base for relative regression
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: completion-reference
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Check absolute budgets and normalized scaling
        env:
          REFERENCE_DIR: ${{ github.workspace }}/completion-reference
        shell: bash
        run: |
          if [[ -f "$REFERENCE_DIR/crates/vell-completion/Cargo.toml" ]]; then
            reference_log="$RUNNER_TEMP/completion-reference.log"
            cargo test --manifest-path \
              "$REFERENCE_DIR/crates/vell-completion/Cargo.toml" --release \
              --features benchmarking \
              completion_matcher_absolute_and_scaling_gate -- \
              --ignored --nocapture | tee "$reference_log"
            echo "COMPLETION_REFERENCE_LOG=$reference_log" >> "$GITHUB_ENV"
          fi
      - name: Check current absolute and relative budgets
        run: >-
          cargo test --locked -p vell-completion --release
          --features benchmarking completion_matcher_absolute_and_scaling_gate
          -- --ignored --nocapture
      - name: Check the 100k session memory budget
        run: >-
          cargo test --locked -p vell-completion --release
          --features benchmarking
          hundred_thousand_item_session_stays_below_memory_budget
          -- --nocapture
      - name: Check M2 local-source latency budgets
        run: >-
          cargo test --locked -p vell-app --release
          m2_completion_performance_gate
          -- --ignored --nocapture
      - name: Check M2 completion render budget
        run: >-
          cargo test --locked -p vell-tui --release
          completion_popup_render_performance_gate
          -- --ignored --nocapture
  full-host:
    name: Full V8 host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Test the complete workspace
        run: cargo test --locked --workspace --all-features
